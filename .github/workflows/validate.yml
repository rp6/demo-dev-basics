name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files exist
        run: test -f index.html && test -f styles.css
      - name: Simple HTML sanity check
        run: grep -q "<title>" index.html
